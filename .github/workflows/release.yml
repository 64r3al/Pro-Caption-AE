name: Release ZXP

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for, e.g. v1.3.0 (must match package.json version)'
        required: true

# A version branch and its generated tag share the same name. Serialize them so the tag-triggered
# follow-up can see the release created by the branch-triggered run.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-zxp:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Avoid duplicate tag-triggered release after a version-branch publish
        id: release_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
            if [[ "$status" == "200" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "The release already exists; skipping the duplicate tag-triggered run."
            fi
          fi

      - name: Set up Node.js
        if: steps.release_guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.release_guard.outputs.skip != 'true'
        run: npm ci

      - name: Run unit tests
        if: steps.release_guard.outputs.skip != 'true'
        run: npm test

      - name: Type-check panel and host code
        if: steps.release_guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Run lint/type check
        if: steps.release_guard.outputs.skip != 'true'
        run: npm run lint

      - name: Build signed ZXP
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          export ZXP_PASSWORD="$(openssl rand -hex 24)"
          npm run zxp

      - name: Verify signature, package version, and rename
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          src="$(ls dist/zxp/*.zxp | head -n 1)"
          node_modules/vite-cep-plugin/lib/bin/ZXPSignCmd.exe -verify "$src"
          version="$(node -p "require('./package.json').version")"
          expected_version="${TAG#v}"
          if [[ "$version" != "$expected_version" ]]; then
            echo "Tag $TAG does not match package.json version $version."
            exit 1
          fi
          mkdir -p out
          cp "$src" "out/Pro-Caption-AE_${version}.zxp"
          ls -l out

      - name: Attach to release
        if: steps.release_guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Pro Caption AE ${{ env.TAG }}
          body_path: .github/release-notes.md
          prerelease: false
          make_latest: true
          files: out/*.zxp
          fail_on_unmatched_files: true
